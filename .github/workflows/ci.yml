name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias bloqueadas
        run: npm ci
      - name: Validar sintaxis del servidor
        run: node --check server.js
      - name: Ejecutar pruebas
        run: npm test
      - name: Auditar dependencias de producción
        run: npm audit --omit=dev --audit-level=high
