name: Production Smoke Once V2

on:
  push:
    branches:
      - agent/production-smoke-once-v2

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Recorrer producción con academia desechable
        run: node scripts/productionSmokeOnce.js
