name: Refactor simple competition events
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: write
jobs:
  integrate:
    if: github.head_ref == 'refactor/simple-competitions-events'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/simple-competitions-events
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Afinar lenguaje universal de eventos
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('services/competitiveStatsCatalog.js')
          s=p.read_text()
          changes={
            "code: 'tenis', label: 'Tenis', icon: '🎾', activityLabel: 'Partido', opponentLabel: 'Rival'":"code: 'tenis', label: 'Tenis', icon: '🎾', activityLabel: 'Duelo', opponentLabel: 'Rival'",
            "code: 'padel', label: 'Pádel', icon: '🎾', activityLabel: 'Partido', opponentLabel: 'Rival / pareja'":"code: 'padel', label: 'Pádel', icon: '🎾', activityLabel: 'Duelo', opponentLabel: 'Rival / pareja'",
            "code: 'natacion', label: 'Natación', icon: '🏊', activityLabel: 'Competencia', opponentLabel: 'Evento / prueba'":"code: 'natacion', label: 'Natación', icon: '🏊', activityLabel: 'Prueba', opponentLabel: 'Prueba / serie'",
            "code: 'atletismo', label: 'Atletismo', icon: '🏃', activityLabel: 'Competencia', opponentLabel: 'Evento / prueba'":"code: 'atletismo', label: 'Atletismo', icon: '🏃', activityLabel: 'Prueba', opponentLabel: 'Prueba / carrera'",
            "code: 'gimnasia', label: 'Gimnasia', icon: '🤸', activityLabel: 'Competencia', opponentLabel: 'Evento / aparato'":"code: 'gimnasia', label: 'Gimnasia', icon: '🤸', activityLabel: 'Presentación', opponentLabel: 'Aparato / presentación'",
            "code: 'karate', label: 'Karate', icon: '🥋', activityLabel: 'Participación', opponentLabel: 'Rival / evento'":"code: 'karate', label: 'Karate', icon: '🥋', activityLabel: 'Duelo / presentación', opponentLabel: 'Rival / modalidad'",
            "code: 'artes_marciales', label: 'Artes marciales', icon: '🥋', activityLabel: 'Competencia', opponentLabel: 'Evento / rival'":"code: 'artes_marciales', label: 'Artes marciales', icon: '🥋', activityLabel: 'Duelo / prueba', opponentLabel: 'Rival / modalidad'",
            "code: 'generico', label: 'Deporte', icon: '🏅', activityLabel: 'Encuentro', opponentLabel: 'Rival / evento'":"code: 'generico', label: 'Deporte', icon: '🏅', activityLabel: 'Evento', opponentLabel: 'Rival / evento'",
          }
          for old,new in changes.items():
              if old not in s:
                  raise SystemExit('No se encontró patrón: '+old)
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: node --check services/competitiveStatsCatalog.js
      - run: npm test
      - name: Guardar cambio y retirar workflow temporal
        run: |
          git config user.name "djara88"
          git config user.email "d.jarazerene@gmail.com"
          git rm .github/workflows/refactor-simple-competition-events.yml
          git add services/competitiveStatsCatalog.js
          git commit -m "Adaptar tipos de evento por disciplina" || true
          git push origin HEAD:refactor/simple-competitions-events
