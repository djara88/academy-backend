name: Gate competitions by plan
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'fix/competitions-plan-gate-20260819'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/competitions-plan-gate-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Mover competencias fuera de Formación y proteger APIs
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('services/planCatalog.js')
          s = p.read_text()
          s = s.replace("  FEATURES.PROFESSORS,\n  FEATURES.MATCHES,\n  FEATURES.TOURNAMENTS,\n  FEATURES.EVALUATIONS,", "  FEATURES.PROFESSORS,\n  FEATURES.EVALUATIONS,")
          s = s.replace("const COMPETITION_FEATURES = [\n  ...BASE_FEATURES,\n  FEATURES.MATCH_PREPARATION,", "const COMPETITION_FEATURES = [\n  ...BASE_FEATURES,\n  FEATURES.MATCHES,\n  FEATURES.TOURNAMENTS,\n  FEATURES.MATCH_PREPARATION,")
          p.write_text(s)

          for route, feature in [('routes/torneosMultirama.js','TOURNAMENTS'), ('routes/partidosMultirama.js','MATCHES')]:
              p = Path(route)
              s = p.read_text()
              auth = "const authMiddleware = require('../middleware/auth');\n"
              imports = auth + "const { requireFeature } = require('../middleware/planAccess');\nconst { FEATURES } = require('../services/planCatalog');\n"
              if "requireFeature" not in s:
                  s = s.replace(auth, imports, 1)
              marker = "const router = express.Router();\nrouter.use(authMiddleware);\n"
              gated = marker + f"router.use(...requireFeature(FEATURES.{feature}));\n"
              if f"requireFeature(FEATURES.{feature})" not in s:
                  s = s.replace(marker, gated, 1)
              p.write_text(s)

          p = Path('test/planCatalog.test.js')
          s = p.read_text()
          old = """test('torneos son base y las funciones avanzadas diferencian los planes', () => {
  const formation = getAcademyEntitlements({ plan_codigo: 'formacion' });
  const competition = getAcademyEntitlements({ plan_codigo: 'competencia' });
  const highPerformance = getAcademyEntitlements({ plan_codigo: 'alto_rendimiento' });
  assert.equal(formation.features.includes(FEATURES.TOURNAMENTS), true);
  assert.equal(competition.features.includes(FEATURES.TOURNAMENTS), true);
  assert.equal(highPerformance.features.includes(FEATURES.TOURNAMENTS), true);
"""
          new = """test('competencias y resultados están disponibles desde Competencia', () => {
  const formation = getAcademyEntitlements({ plan_codigo: 'formacion' });
  const competition = getAcademyEntitlements({ plan_codigo: 'competencia' });
  const highPerformance = getAcademyEntitlements({ plan_codigo: 'alto_rendimiento' });
  assert.equal(formation.features.includes(FEATURES.TOURNAMENTS), false);
  assert.equal(formation.features.includes(FEATURES.MATCHES), false);
  assert.equal(competition.features.includes(FEATURES.TOURNAMENTS), true);
  assert.equal(competition.features.includes(FEATURES.MATCHES), true);
  assert.equal(highPerformance.features.includes(FEATURES.TOURNAMENTS), true);
  assert.equal(highPerformance.features.includes(FEATURES.MATCHES), true);
"""
          if old not in s: raise SystemExit('No se encontró la prueba de torneos esperada')
          p.write_text(s.replace(old,new,1))
          PY
      - run: node --check services/planCatalog.js && node --check routes/torneosMultirama.js && node --check routes/partidosMultirama.js && node --check test/planCatalog.test.js
      - run: npm test
      - name: Guardar cambio y retirar workflow temporal
        run: |
          git config user.name "djara88"
          git config user.email "d.jarazerene@gmail.com"
          git rm .github/workflows/plan-gate-competitions-temp.yml
          git add services/planCatalog.js routes/torneosMultirama.js routes/partidosMultirama.js test/planCatalog.test.js
          git commit -m "Restringir competencias a planes Competencia y Alto Rendimiento"
          git push origin HEAD:fix/competitions-plan-gate-20260819
