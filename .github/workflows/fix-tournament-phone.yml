name: Fix tournament player phone

on:
  push:
    branches: [fix/tournament-player-phone]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tournament-player-phone
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Corregir teléfonos en torneos multirrama
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('routes/torneosMultirama.js')
          s = p.read_text()

          anchor = "const router = express.Router();\nrouter.use(authMiddleware);\n"
          helper = "const router = express.Router();\nrouter.use(authMiddleware);\n\nconst getStudentTutorId = (student) => student?.tutor_id || student?.tutor_principal_id || student?.apoderado_id || null;\n"
          if anchor not in s:
              raise SystemExit('No se encontró el ancla del router')
          s = s.replace(anchor, helper, 1)

          replacements = {
            "playerSelect: 'id,nombre,foto_base64,foto_url,avatar_url,tutor_id,telefono',": "playerSelect: 'id,nombre,foto_base64,foto_url,avatar_url,tutor_id,tutor_principal_id,apoderado_id,telefono_apoderado',",
            "playerSelect: 'id,nombre,tutor_id,telefono',": "playerSelect: 'id,nombre,tutor_id,tutor_principal_id,apoderado_id,telefono_apoderado',",
            "const tutorIds = uniqueIds(eligible.map((student) => student.tutor_id));": "const tutorIds = uniqueIds(eligible.map((student) => getStudentTutorId(student)));",
            "const tutor = tutorMap.get(String(student.tutor_id));": "const tutor = tutorMap.get(String(getStudentTutorId(student)));",
            "telefono_apoderado: tutor?.telefono || student.telefono || '',": "telefono_apoderado: tutor?.telefono || student.telefono_apoderado || '',",
            "const phoneSource = tutor?.telefono || student.telefono;": "const phoneSource = tutor?.telefono || student.telefono_apoderado;",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'No se encontró: {old}')
              s = s.replace(old, new)

          if 'student.telefono' in s or 'tutor_id,telefono' in s:
              raise SystemExit('Quedó una referencia al campo jugadores.telefono')

          p.write_text(s)
          PY
      - name: Validar sintaxis
        run: node --check routes/torneosMultirama.js
      - name: Ejecutar tests
        run: npm test
      - name: Commit limpio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-tournament-phone.yml
          git add routes/torneosMultirama.js
          git commit -m "fix: corregir teléfono de alumnos en torneos multirrama"
          git push
