name: Validate fast PDFs

on:
  push:
    branches:
      - agent/redesign-fast-pdfs

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/redesign-fast-pdfs

      - name: Aplicar pulido visual final
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('services/premiumPdf.js')
          s = p.read_text()
          old = """const drawTerms = (doc, terms, theme) => {\n  const x = doc.page.margins.left;\n  const boxY = doc.y;\n  const maxHeight = 170;\n  doc.roundedRect(x, boxY, contentWidth(doc), maxHeight, 12).fill(LIGHT).strokeColor(BORDER).lineWidth(0.7).stroke();\n  const text = terms || 'La academia no mantiene términos adicionales de matrícula configurados en Syncademia. Cualquier reglamento o condición complementaria debe ser informado por los canales oficiales de la academia.';\n  const fontSize = text.length > 2300 ? 7.2 : text.length > 1400 ? 7.8 : 8.6;\n  doc.fillColor(TEXT).font('Helvetica').fontSize(fontSize)\n    .text(text, x + 14, boxY + 14, { width: contentWidth(doc) - 28, height: maxHeight - 28, lineGap: 2.5, ellipsis: text.length > 3300 });\n  doc.y = boxY + maxHeight + 14;\n};"""
          new = """const drawTerms = (doc, terms, theme) => {\n  const x = doc.page.margins.left;\n  const boxY = doc.y;\n  const text = terms || 'La academia no mantiene términos adicionales de matrícula configurados en Syncademia. Cualquier reglamento o condición complementaria debe ser informado por los canales oficiales de la academia.';\n  const fontSize = text.length > 2300 ? 7.2 : text.length > 1400 ? 7.8 : 8.6;\n  doc.font('Helvetica').fontSize(fontSize);\n  const measured = doc.heightOfString(text, { width: contentWidth(doc) - 28, lineGap: 2.5 });\n  const boxHeight = Math.min(170, Math.max(78, measured + 30));\n  doc.roundedRect(x, boxY, contentWidth(doc), boxHeight, 12).fill(LIGHT).strokeColor(BORDER).lineWidth(0.7).stroke();\n  doc.fillColor(TEXT).font('Helvetica').fontSize(fontSize)\n    .text(text, x + 14, boxY + 14, { width: contentWidth(doc) - 28, height: boxHeight - 28, lineGap: 2.5, ellipsis: measured > boxHeight - 28 });\n  doc.y = boxY + boxHeight + 14;\n};"""
          if old in s:
              s = s.replace(old, new, 1)

          s = s.replace("const drawRankCard = (bx, title, items, fill, icon, color) => {", "const drawRankCard = (bx, title, items, fill, color) => {")
          s = s.replace(".text(`${icon} ${title}`, bx + 13, strengthY + 13, { width: colW - 26 });", ".text(title, bx + 13, strengthY + 13, { width: colW - 26 });")
          s = s.replace("drawRankCard(x, 'FORTALEZAS', strengths, '#ECFDF5', '★', SUCCESS);", "drawRankCard(x, 'FORTALEZAS', strengths, '#ECFDF5', SUCCESS);")
          s = s.replace("drawRankCard(x + colW + colGap, 'PRÓXIMOS FOCOS', focuses, '#FFF7ED', '→', WARNING);", "drawRankCard(x + colW + colGap, 'PRÓXIMOS FOCOS', focuses, '#FFF7ED', WARNING);")
          p.write_text(s)

          route = Path('routes/documentos.js')
          r = route.read_text()
          r = r.replace('.limit(8)', '.limit(2)', 1)
          route.write_text(r)
          PY

      - name: Guardar pulido funcional
        run: |
          if git diff --quiet services/premiumPdf.js routes/documentos.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/premiumPdf.js routes/documentos.js
          git commit -m "Pulir diseño y consulta de documentos premium"
          git push origin HEAD:agent/redesign-fast-pdfs

      - name: Instalar dependencias
        run: npm install

      - name: Guardar package-lock actualizado
        run: |
          if git diff --quiet package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Actualizar lock para optimización de PDFs"
          git push origin HEAD:agent/redesign-fast-pdfs

      - name: Validar backend
        run: |
          node --check services/premiumPdf.js
          npm test
          npm audit --omit=dev --audit-level=high

      - name: Generar previews reales
        run: |
          mkdir -p pdf-preview
          node <<'NODE'
          const fs = require('fs');
          const sharp = require('sharp');
          const { generateMatriculaPdf, generatePlayerReportPdf } = require('./services/premiumPdf');

          (async () => {
            const logoBuffer = await sharp({ create: { width: 1600, height: 1600, channels: 4, background: '#102A43' } })
              .png({ compressionLevel: 3 }).toBuffer();
            const photoBuffer = await sharp({ create: { width: 1200, height: 1600, channels: 3, background: '#D9E2EC' } })
              .jpeg({ quality: 96 }).toBuffer();
            const logo = `data:image/png;base64,${logoBuffer.toString('base64')}`;
            const photo = `data:image/jpeg;base64,${photoBuffer.toString('base64')}`;

            const academia = {
              nombre: 'Academia Horizonte Elite',
              direccion: 'Av. Deportiva 1250, Santiago',
              telefono: '+56 9 1234 5678',
              director_email: 'direccion@horizonte.cl',
              nombre_director: 'Carolina Martínez',
              dias_entrenamiento: 'Martes y jueves',
              horarios_entrenamiento: '18:30 a 20:00 hrs',
              ubicacion_entrenamiento: 'Complejo Deportivo Central - Cancha 2',
              color_primario: '#102A43',
              color_secundario: '#D4AF37',
              logo,
              terminos_matricula: 'La familia declara conocer los valores informados en esta matrícula, mantener actualizados sus datos de contacto y respetar las normas de convivencia y funcionamiento comunicadas oficialmente por la academia. Cualquier condición adicional será informada por los canales institucionales.',
            };
            const jugador = {
              nombre: 'Vicente Jara Peña', rut: '27.811.911-4', fecha_nacimiento: '2012-05-23',
              posicion_cancha: 'Mediocampista', tipo_alumno: 'Nuevo', estado_matricula: 'Registrada',
              monto_matricula: 80000, abono_matricula: 35000, monto_mensualidad: 25000,
              foto_base64: photo, categorias: [{ nombre: 'Sub-14' }],
              insignias: [{ nombre: 'Premio al Compañerismo' }, { nombre: 'Jugador del Partido' }],
            };
            const tutor = {
              nombre_completo: 'Daniel Jara Zerene', rut: '16.608.263-3',
              telefono: '+56 9 4005 4804', email: 'apoderado@example.com',
            };

            const t1 = Date.now();
            const matricula = await generateMatriculaPdf({
              academia, jugador, tutor, folio: 'MAT-2026-000321',
              consentimientos: [
                { tipo: 'aviso_privacidad', estado: 'aceptado' },
                { tipo: 'datos_salud', estado: 'aceptado' },
                { tipo: 'imagen_interna', estado: 'aceptado' },
                { tipo: 'imagen_publica', estado: 'rechazado' },
              ],
            });
            fs.writeFileSync('pdf-preview/matricula-preview.pdf', matricula);
            console.log(`MATRICULA bytes=${matricula.length} ms=${Date.now() - t1}`);

            const t2 = Date.now();
            const informe = await generatePlayerReportPdf({
              academia, jugador, tutor,
              evaluaciones: [
                { created_at: new Date().toISOString(), datos_radar: { Velocidad: 78, Remate: 67, Pase: 86, Defensa: 73, Fisico: 75, Mental: 88 }, comentarios_profesor: 'Muy buena evolución.' },
                { created_at: '2026-05-20T12:00:00Z', datos_radar: { Velocidad: 70, Remate: 62, Pase: 79, Defensa: 68, Fisico: 71, Mental: 80 } },
              ],
              stats: { partidos_jugados: 12, goles: 4, asistencias: 8, mvp: 2, clases_presente: 24, clases_ausente: 2, clases_justificadas: 1 },
              comentarios: 'Vicente ha mostrado una evolución sostenida en la lectura del juego y en su capacidad para asociarse. El próximo foco será mejorar la finalización y mantener la intensidad sin balón.',
            });
            fs.writeFileSync('pdf-preview/informe-preview.pdf', informe);
            console.log(`INFORME bytes=${informe.length} ms=${Date.now() - t2}`);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-preview
          path: pdf-preview/*.pdf
          retention-days: 2
