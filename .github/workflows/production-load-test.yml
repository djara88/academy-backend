name: Production Load Test

on:
  push:
    branches:
      - agent/production-load-test-live3

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ejecutar carga controlada contra producción
        run: node scripts/productionLoadTest.js
