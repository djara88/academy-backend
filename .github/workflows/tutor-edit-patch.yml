name: Apply tutor edit patch

on:
  push:
    branches:
      - agent/import-template-tutor-edit

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[tutor-edit-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-template-tutor-edit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/patch_tutor_edit.py
      - run: |
          npm ci
          node --check routes/apoderados.js
          npm test
          npm audit --omit=dev --audit-level=high
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/apoderados.js
          git diff --cached --quiet && exit 0
          git commit -m "Permitir editar datos de apoderados [tutor-edit-patch]"
          git push origin HEAD:agent/import-template-tutor-edit
