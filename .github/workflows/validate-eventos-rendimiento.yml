name: Validate Eventos y Rendimiento

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check server syntax
        run: node --check server.js
      - name: Check performance catalog
        run: node --check services/performanceCatalog.js
      - name: Check performance records
        run: node --check services/performanceRecords.js
      - name: Check performance routes
        run: node --check routes/rendimiento.js
      - name: Check analytics routes
        run: node --check routes/rendimientoAnalytics.js
      - name: Check competition lifecycle routes
        run: node --check routes/torneosLifecycle.js
