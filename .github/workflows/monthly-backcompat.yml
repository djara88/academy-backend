name: Monthly billing backward compatibility

on:
  push:
    branches:
      - agent/monthly-billing-calendar

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/monthly-billing-calendar
      - name: Patch compatibility response
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('routes/finanzas.js')
          s=p.read_text()
          old='''        ...resumenCuenta,
                  alDia: resumenCuenta.saldoVencido <= 0,'''
          new='''        ...resumenCuenta,
                  saldoTotalPendiente: resumenCuenta.saldoPendiente,
                  saldoPendiente: resumenCuenta.saldoVencido,
                  alDia: resumenCuenta.saldoVencido <= 0,'''
          if 'saldoTotalPendiente: resumenCuenta.saldoPendiente' not in s:
              if old not in s:
                  raise SystemExit('Expected finance response block not found')
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
      - name: Validate
        run: |
          npm ci
          node --check routes/finanzas.js
          npm test
          npm audit --omit=dev --audit-level=high
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/finanzas.js
          git diff --cached --quiet && exit 0
          git commit -m "Evitar mora visual antes del vencimiento [monthly-backcompat]"
          git push origin HEAD:agent/monthly-billing-calendar
