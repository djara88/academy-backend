name: Apply signed enrollment PDF
on:
  push:
    branches: [agent/prematricula-import-report-v2]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prematricula-import-report-v2
      - name: Aplicar integración
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('routes/prematriculas.js')
          s = p.read_text()
          old_import = "const { generateMatriculaPdf, selectEnrollmentTerms } = require('../services/premiumPdf');"
          new_import = "const { selectEnrollmentTerms } = require('../services/premiumPdf');\nconst { generateSignedEnrollmentPdf } = require('../services/signedEnrollmentPdf');"
          s = s.replace(old_import, new_import, 1)
          old_call = "    const pdfBuffer = await generateMatriculaPdf({\n      academia,\n      jugador: materialized.jugador,\n      tutor,\n      folio,\n      consentimientos: consentRows,\n      firma: { nombre: signedByName, documento: signedByDocument, fecha: now, ip, evidence_sha256: evidenceHash, data_url: signature },\n    });"
          new_call = "    const pdfBuffer = await generateSignedEnrollmentPdf({\n      academia,\n      jugador: materialized.jugador,\n      tutor,\n      folio,\n      terms: pre.terms_snapshot,\n      consentimientos: consentRows,\n      firma: { nombre: signedByName, documento: signedByDocument, fecha: now, ip, evidence_sha256: evidenceHash, data_url: signature },\n    });"
          if old_call not in s:
              raise SystemExit('No se encontró el bloque esperado del generador de matrícula')
          s = s.replace(old_call, new_call, 1)
          p.write_text(s)
          PY
      - name: Validar sintaxis
        run: |
          node --check routes/prematriculas.js
          node --check services/signedEnrollmentPdf.js
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/prematriculas.js
          git commit -m "Mostrar firma y evidencia en matrícula final"
          git push origin HEAD:agent/prematricula-import-report-v2
