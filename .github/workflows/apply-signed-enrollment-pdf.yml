name: Apply signed enrollment PDF
on:
  push:
    branches: [agent/prematricula-import-report-v2]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prematricula-import-report-v2
      - name: Aplicar integración
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('routes/prematriculas.js')
          s = p.read_text()
          s = s.replace("const { generateMatriculaPdf, selectEnrollmentTerms } = require('../services/premiumPdf');", "const { selectEnrollmentTerms } = require('../services/premiumPdf');\nconst { generateSignedEnrollmentPdf } = require('../services/signedEnrollmentPdf');")
          old = """    const pdfBuffer = await generateMatriculaPdf({
      academia,
      jugador: materialized.jugador,
      tutor,
      folio,
      consentimientos: consentRows,
      firma: { nombre: signedByName, documento: signedByDocument, fecha: now, ip, evidence_sha256: evidenceHash, data_url: signature },
    });"""
          new = """    const pdfBuffer = await generateSignedEnrollmentPdf({
      academia,
      jugador: materialized.jugador,
      tutor,
      folio,
      terms: pre.terms_snapshot,
      consentimientos: consentRows,
      firma: { nombre: signedByName, documento: signedByDocument, fecha: now, ip, evidence_sha256: evidenceHash, data_url: signature },
    });"""
          if old not in s:
              raise SystemExit('No se encontró el bloque esperado del generador de matrícula')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Validar sintaxis
        run: |
          node --check routes/prematriculas.js
          node --check services/signedEnrollmentPdf.js
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/prematriculas.js
          git commit -m "Mostrar firma y evidencia en matrícula final"
          git push origin HEAD:agent/prematricula-import-report-v2
