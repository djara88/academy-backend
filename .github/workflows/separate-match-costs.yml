name: Separate match costs from finance

on:
  push:
    branches: [fix/separate-match-costs-from-finance]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/separate-match-costs-from-finance
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Retirar egresos automáticos desde Partidos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('routes/partidosMultirama.js')
          s = p.read_text()
          s2, n = re.subn(r"\n\s*const expenses = \[\];\n\s*const refereeCost = Math\.max\(0, Number\(req\.body\?\.costo_arbitraje_total\) \|\| 0\);\n\s*const venueCost = Math\.max\(0, Number\(req\.body\?\.costo_cancha\) \|\| 0\);\n.*?\n\s*if \(expenses\.length\) \{\n\s*const \{ error: expenseError \} = await supabase\.from\('egresos'\)\.insert\(expenses\);\n\s*if \(expenseError\) throw expenseError;\n\s*\}\n", "\n", s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('No se encontró bloque de egresos automáticos en partidosMultirama.js')
          p.write_text(s2)

          p = Path('routes/partidos.js')
          s = p.read_text()
          s = s.replace('// 1. CREAR ENCUENTRO + EGRESOS AUTOMÁTICOS', '// 1. CREAR ENCUENTRO')
          s = s.replace('      costo_arbitraje_total, costo_cancha,\n', '')
          s2, n = re.subn(r"\n\s*const egresosPartidos = \[\];\n.*?\n\s*if \(egresosPartidos\.length > 0\) await supabase\.from\('egresos'\)\.insert\(egresosPartidos\);\n", "\n", s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('No se encontró bloque de egresos automáticos en partidos.js')
          p.write_text(s2)

          for path in ['routes/partidosMultirama.js','routes/partidos.js']:
              text = Path(path).read_text()
              if 'costo_arbitraje_total' in text or 'costo_cancha' in text:
                  raise SystemExit(f'Quedaron costos internos en {path}')
          PY
      - run: node --check routes/partidosMultirama.js
      - run: node --check routes/partidos.js
      - run: npm test
      - name: Guardar cambio limpio
        run: |
          rm -f .github/workflows/separate-match-costs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/partidosMultirama.js routes/partidos.js .github/workflows/separate-match-costs.yml
          git commit -m "fix: gestionar costos internos de encuentros solo desde Finanzas"
          git push
