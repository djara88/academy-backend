name: Verify premium docs and consents

on:
  push:
    branches:
      - agent/premium-docs-consents

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check server.js
      - run: node --check routes/matriculas.js
      - run: node --check routes/documentos.js
      - run: node --check routes/consentimientos.js
      - run: node --check services/premiumPdf.js
      - run: node --check services/privacyConsents.js
      - run: npm test
      - run: npm audit --audit-level=high
