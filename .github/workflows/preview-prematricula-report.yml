name: Preview prematricula and report
on:
  push:
    branches: [agent/prematricula-import-report-v2]
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generar documentos de muestra
        run: |
          mkdir -p previews
          node <<'NODE'
          const fs = require('fs');
          const sharp = require('sharp');
          const { generateSignedEnrollmentPdf } = require('./services/signedEnrollmentPdf');
          const { generatePlayerReportV2 } = require('./services/playerReportV2');
          const asData = (mime, buf) => `data:${mime};base64,${buf.toString('base64')}`;
          (async () => {
            const logo = asData('image/png', await sharp({create:{width:500,height:500,channels:4,background:'#102A43'}}).png().toBuffer());
            const photo = asData('image/jpeg', await sharp({create:{width:600,height:800,channels:3,background:'#cbd5e1'}}).jpeg({quality:80}).toBuffer());
            const medal1 = asData('image/png', await sharp(Buffer.from(`<svg width="180" height="180" xmlns="http://www.w3.org/2000/svg"><circle cx="90" cy="90" r="78" fill="#D4AF37"/><circle cx="90" cy="90" r="58" fill="#102A43"/><text x="90" y="105" font-size="56" text-anchor="middle" fill="white">1</text></svg>`)).png().toBuffer());
            const medal2 = asData('image/png', await sharp(Buffer.from(`<svg width="180" height="180" xmlns="http://www.w3.org/2000/svg"><circle cx="90" cy="90" r="78" fill="#289E9D"/><path d="M90 35 L105 72 L145 75 L114 100 L124 140 L90 118 L56 140 L66 100 L35 75 L75 72 Z" fill="white"/></svg>`)).png().toBuffer());
            const signature = asData('image/png', await sharp(Buffer.from(`<svg width="700" height="220" xmlns="http://www.w3.org/2000/svg"><path d="M35 150 C90 40 120 210 175 100 S260 65 280 145 C315 70 345 85 365 140 C395 95 420 90 450 132 C490 90 535 95 650 118" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/></svg>`)).png().toBuffer());
            const academia = { nombre:'Academia Horizonte Elite', logo, color_primario:'#102A43', color_secundario:'#D4AF37', direccion:'Av. Deportiva 1250, Santiago', telefono:'+56 9 1234 5678', director_email:'direccion@academia.cl', nombre_director:'Carolina Martínez', dias_entrenamiento:'Martes y jueves', horarios_entrenamiento:'18:30 a 20:00', ubicacion_entrenamiento:'Complejo Deportivo Central · Cancha 2' };
            const jugador = { nombre:'Vicente Jara Peña', rut:'27.811.911-4', fecha_nacimiento:'2012-05-23', posicion_cancha:'Mediocampista', tipo_alumno:'Nuevo', estado_matricula:'Activa', monto_matricula:80000, abono_matricula:35000, monto_mensualidad:25000, foto_base64:photo, categorias:[{nombre:'Sub-14'}] };
            const tutor = { nombre_completo:'Daniel Jara Zerene', rut:'16.608.263-3', telefono:'+56 9 4005 4804', email:'apoderado@example.com' };
            const consents = [
              {tipo:'aviso_privacidad',estado:'aceptado'}, {tipo:'datos_salud',estado:'aceptado'},
              {tipo:'imagen_interna',estado:'aceptado'}, {tipo:'imagen_publica',estado:'rechazado'}
            ];
            const enrollment = await generateSignedEnrollmentPdf({ academia, jugador, tutor, folio:'MAT-2026-000777', terms:'La familia declara haber leído el reglamento de funcionamiento, conocer los valores informados, mantener actualizados sus datos de contacto y respetar las normas de convivencia, asistencia, puntualidad y seguridad comunicadas por la academia.', consentimientos:consents, firma:{nombre:tutor.nombre_completo,documento:tutor.rut,fecha:new Date('2026-08-15T18:20:00Z'),ip:'181.42.xxx.xxx',evidence_sha256:'1f4f7d54d9f10a9db844c7358f4fca1e20db8250d29c7bbca5db0e4f604dad12',data_url:signature} });
            fs.writeFileSync('previews/matricula-firmada.pdf', enrollment);
            const report = await generatePlayerReportV2({ academia, jugador, tutor,
              evaluaciones:[
                {created_at:'2026-08-15T12:00:00Z',datos_radar:{Velocidad:82,Remate:72,Pase:88,Defensa:76,Físico:79,Mental:91},comentarios_profesor:'Excelente evolución en lectura de juego.'},
                {created_at:'2026-05-20T12:00:00Z',datos_radar:{Velocidad:70,Remate:63,Pase:78,Defensa:69,Físico:72,Mental:80}}
              ],
              stats:{partidos_jugados:14,goles:5,asistencias:9,mvp:3,clases_presente:27,clases_ausente:2,clases_justificadas:1},
              comentarios:'Vicente ha mostrado una evolución sostenida en lectura del juego, pase y toma de decisiones. El próximo foco será mejorar la finalización y mantener la intensidad sin balón.',
              badges:[
                {titulo:'Jugador del partido',descripcion:'Destacado por impacto y compañerismo',icono_url:medal1,fecha_otorgado:'2026-08-10'},
                {titulo:'Evolución destacada',descripcion:'Progreso técnico del período',icono_url:medal2,fecha_otorgado:'2026-07-22'},
                {titulo:'Asistencia sobresaliente',descripcion:'Constancia durante el ciclo',icono_url:medal1,fecha_otorgado:'2026-06-30'}
              ]
            });
            fs.writeFileSync('previews/informe-v2.pdf', report);
            console.log(JSON.stringify({matricula_bytes:enrollment.length,matricula_ms:enrollment.generationMs,informe_bytes:report.length,informe_ms:report.generationMs}));
          })().catch((e)=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: prematricula-report-previews
          path: previews/*.pdf
          retention-days: 2
