name: Harden monitor paths

on:
  push:
    branches:
      - agent/privacy-monitor

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[monitor-paths-hardened]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/privacy-monitor
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/harden_monitor_paths.py
      - run: |
          npm ci
          node --check services/systemMonitor.js
          npm test
          npm audit --omit=dev --audit-level=high
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/systemMonitor.js
          git diff --cached --quiet && exit 0
          git commit -m "Anonimizar rutas del monitor [monitor-paths-hardened]"
          git push origin HEAD:agent/privacy-monitor
