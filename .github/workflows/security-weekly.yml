name: Weekly Security Audit

on:
  schedule:
    - cron: '17 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-security-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias bloqueadas
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Auditar dependencias de producción
        run: npm audit --omit=dev --audit-level=high
