name: Dev dependencies refresh

on:
  push:
    branches:
      - agent/remove-dev-audit-risk

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Regenerar lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Retirar workflow temporal
        run: rm .github/workflows/dev-deps-refresh.yml
      - name: Instalar lockfile
        run: npm ci --ignore-scripts
      - name: Pruebas
        run: npm test
      - name: Auditoría completa
        run: npm audit --audit-level=high
      - name: Publicar lockfile limpio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/dev-deps-refresh.yml
          git commit -m "Regenerar lockfile sin nodemon"
          git push
