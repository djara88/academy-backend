name: Apply monthly billing calendar patch
on:
  push:
    branches: [agent/monthly-billing-calendar]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[monthly-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/monthly-billing-calendar
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch academy settings and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('routes/academias.js')
          s=p.read_text()
          if "require('../services/monthlyBilling')" not in s:
              anchor="const { fetchWithTimeout } = require('../services/httpClient');\n"
              s=s.replace(anchor, anchor+"const { ensureMonthlyChargesForAcademy } = require('../services/monthlyBilling');\n")
          old="""router.put('/mi-academia', authMiddleware, async (req, res) => {
            try {
              const { academia_id } = req.user;
              const { nombre, dias_entrenamiento, horarios_entrenamiento, ubicacion_entrenamiento } = req.body;

              const { data, error } = await supabase
                .from('academias')
                .update({
                  nombre,
                  dias_entrenamiento,
                  horarios_entrenamiento,
                  ubicacion_entrenamiento
                })
                .eq('id', academia_id)
                .select()
                .single();

              if (error) throw error;
              res.json({ success: true, data });
            } catch (error) {
              res.status(500).json({ error: error.message });
            }
          });"""
          new="""router.put('/mi-academia', authMiddleware, async (req, res) => {
            try {
              const { academia_id } = req.user;
              const {
                nombre, dias_entrenamiento, horarios_entrenamiento, ubicacion_entrenamiento,
                dia_vencimiento_mensualidad, dias_aviso_mensualidad,
              } = req.body;

              const dueDay = dia_vencimiento_mensualidad === '' || dia_vencimiento_mensualidad === null || dia_vencimiento_mensualidad === undefined
                ? null
                : Number(dia_vencimiento_mensualidad);
              const warningDays = dias_aviso_mensualidad === '' || dias_aviso_mensualidad === null || dias_aviso_mensualidad === undefined
                ? 3
                : Number(dias_aviso_mensualidad);
              if (dueDay !== null && (!Number.isInteger(dueDay) || dueDay < 1 || dueDay > 31)) {
                return res.status(400).json({ error: 'El día de pago mensual debe estar entre 1 y 31.' });
              }
              if (!Number.isInteger(warningDays) || warningDays < 0 || warningDays > 15) {
                return res.status(400).json({ error: 'Los días de aviso deben estar entre 0 y 15.' });
              }

              const { data, error } = await supabase
                .from('academias')
                .update({
                  nombre,
                  dias_entrenamiento,
                  horarios_entrenamiento,
                  ubicacion_entrenamiento,
                  dia_vencimiento_mensualidad: dueDay,
                  dias_aviso_mensualidad: warningDays,
                })
                .eq('id', academia_id)
                .select()
                .single();

              if (error) throw error;
              const billing = await ensureMonthlyChargesForAcademy(academia_id);
              res.json({ success: true, data, billing });
            } catch (error) {
              res.status(500).json({ error: error.message });
            }
          });"""
          if old not in s:
              raise SystemExit('Expected academy settings block not found')
          p.write_text(s.replace(old,new))

          t=Path('test/monthlyBilling.test.js')
          t.write_text("""const test = require('node:test');
          const assert = require('node:assert/strict');
          const { dueDateForPeriod, summarizeCharges } = require('../services/monthlyBilling');

          test('día 31 se ajusta al último día real del mes', () => {
            assert.equal(dueDateForPeriod('2027-02-01', 31), '2027-02-28');
            assert.equal(dueDateForPeriod('2028-02-01', 31), '2028-02-29');
            assert.equal(dueDateForPeriod('2026-04-01', 31), '2026-04-30');
          });

          test('saldo futuro no convierte al alumno en moroso', () => {
            const result = summarizeCharges([{ monto: 30000, monto_pagado: 0, estado: 'Pendiente', fecha_vencimiento: '2026-09-05' }], { today: '2026-09-01', warningDays: 3 });
            assert.equal(result.saldoVencido, 0);
            assert.equal(result.saldoPorVencer, 30000);
            assert.equal(result.estadoCuenta, 'Por vencer');
            assert.equal(result.mostrarAlertaProximoPago, false);
          });

          test('aviso aparece dentro de la ventana y mora solo después del vencimiento', () => {
            const upcoming = summarizeCharges([{ monto: 30000, monto_pagado: 0, estado: 'Pendiente', fecha_vencimiento: '2026-09-05' }], { today: '2026-09-02', warningDays: 3 });
            assert.equal(upcoming.mostrarAlertaProximoPago, true);
            assert.equal(upcoming.estadoCuenta, 'Por vencer');
            const overdue = summarizeCharges([{ monto: 30000, monto_pagado: 0, estado: 'Pendiente', fecha_vencimiento: '2026-09-05' }], { today: '2026-09-06', warningDays: 3 });
            assert.equal(overdue.saldoVencido, 30000);
            assert.equal(overdue.estadoCuenta, 'Moroso');
          });
          """)
          PY
      - name: Validate
        run: |
          npm ci
          node --check routes/academias.js
          node --check routes/finanzas.js
          node --check routes/dashboard.js
          node --check services/monthlyBilling.js
          npm test
          npm audit --omit=dev --audit-level=high
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/academias.js test/monthlyBilling.test.js
          git commit -m "Completar calendario mensual [monthly-patch]" || exit 0
          git push origin HEAD:agent/monthly-billing-calendar
