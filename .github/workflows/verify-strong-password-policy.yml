name: Verify strong password policy

on:
  push:
    branches:
      - agent/strong-password-policy

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check server.js
      - run: node --check services/passwordPolicy.js
      - run: npm test
      - run: npm audit --audit-level=high
