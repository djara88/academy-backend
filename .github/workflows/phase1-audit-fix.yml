name: Phase 1 Audit Lockfile Fix

on:
  push:
    branches:
      - chore/phase1-release-governance
    paths:
      - .github/workflows/phase1-audit-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/phase1-release-governance
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'
          cache: npm
      - name: Apply compatible audit fixes to lockfile
        run: npm audit fix --package-lock-only
      - name: Commit synchronized lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No compatible lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: refresh vulnerable transitive dependencies"
          git push origin HEAD:chore/phase1-release-governance
