name: Lestra Sentinel CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'sentinel/**'
      - '.github/workflows/lestra-sentinel*.yml'
  push:
    branches: [main]
    paths:
      - 'sentinel/**'
      - '.github/workflows/lestra-sentinel*.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.x'

      - name: Validar sintaxis
        run: node --check sentinel/monitor.mjs

      - name: Ejecutar pruebas unitarias
        run: node --test sentinel/monitor.test.mjs
