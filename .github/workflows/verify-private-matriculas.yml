name: Verify private matriculas

on:
  push:
    branches:
      - agent/harden-private-matriculas

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Validar sintaxis
        run: node --check routes/matriculas.js
      - name: Ejecutar pruebas
        run: npm test
      - name: Auditar dependencias
        run: npm audit --audit-level=high
