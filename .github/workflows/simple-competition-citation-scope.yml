name: Simple competition citation scope
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: write
jobs:
  integrate:
    if: github.head_ref == 'refactor/simple-competitions-events'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/simple-competitions-events
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Limitar citación a participantes confirmados
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('routes/partidosMultirama.js')
          s=p.read_text()
          old="""    const students = await getStudentsForScope({
      academyId,
      branchId: match.rama_id,
      categoryId: match.categoria_id,
      playerSelect: 'id,nombre,tutor_id,tutor_principal_id,apoderado_id,telefono_apoderado',
    });
    if (!students.length) return res.status(400).json({ error: 'No hay alumnos con inscripción activa en esta categoría.' });
"""
          new="""    let students = await getStudentsForScope({
      academyId,
      branchId: match.rama_id,
      categoryId: match.categoria_id,
      playerSelect: 'id,nombre,tutor_id,tutor_principal_id,apoderado_id,telefono_apoderado',
    });

    if (match.torneo_id) {
      const { data: tournamentParticipants, error: participantError } = await supabase.from('torneo_participantes')
        .select('jugador_id')
        .eq('academia_id', academyId)
        .eq('torneo_id', match.torneo_id)
        .eq('categoria_id', match.categoria_id)
        .eq('respuesta_participacion', 'Si');
      if (participantError) throw participantError;
      const allowedPlayers = new Set((tournamentParticipants || []).map((item) => String(item.jugador_id)));
      students = students.filter((student) => allowedPlayers.has(String(student.id)));
    }

    if (!students.length) {
      return res.status(400).json({
        error: match.torneo_id
          ? 'No hay alumnos confirmados en esta categoría para esta competencia.'
          : 'No hay alumnos con inscripción activa en esta categoría.',
      });
    }
"""
          if old not in s: raise SystemExit('No se encontró bloque de citación esperado')
          p.write_text(s.replace(old,new,1))
          PY
      - run: node --check routes/partidosMultirama.js
      - run: npm test
      - name: Guardar cambio y retirar workflow temporal
        run: |
          git config user.name "djara88"
          git config user.email "d.jarazerene@gmail.com"
          git rm .github/workflows/simple-competition-citation-scope.yml
          git add routes/partidosMultirama.js
          git commit -m "Limitar citaciones a participantes confirmados" || true
          git push origin HEAD:refactor/simple-competitions-events
