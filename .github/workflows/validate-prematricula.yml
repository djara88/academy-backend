name: Validate prematricula feature
on:
  push:
    branches: [agent/prematricula-import-report-v2]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validar sintaxis de nuevas rutas y servicios
        run: |
          node --check server.js
          node --check routes/prematriculas.js
          node --check routes/importaciones.js
          node --check routes/documentos.js
          node --check services/enrollmentService.js
          node --check services/playerReportV2.js
          node --check services/signedEnrollmentPdf.js
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
