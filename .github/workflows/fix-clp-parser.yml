name: Fix CLP parser
on:
  push:
    branches: [agent/fix-import-clp-parser]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-import-clp-parser
      - name: Corregir parser
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('routes/importaciones.js')
          s=p.read_text()
          old="""const numberOrZero = (value) => {
  const raw = String(value ?? '').replace(/\$/g, '').trim();
  if (!raw) return 0;
  const normalized = raw.includes(',') ? raw.replace(/\./g, '').replace(',', '.') : raw.replace(/\s/g, '');
  const parsed = Number(normalized);
  return Number.isFinite(parsed) ? parsed : 0;
};"""
          new="""const numberOrZero = (value) => {
  if (typeof value === 'number') return Number.isFinite(value) ? value : 0;
  const raw = String(value ?? '').replace(/[$\s]/g, '').trim();
  if (!raw) return 0;
  let normalized = raw;
  if (/^-?\\d{1,3}(\\.\\d{3})+(,\\d+)?$/.test(raw)) {
    normalized = raw.replace(/\\./g, '').replace(',', '.');
  } else if (/^-?\\d{1,3}(,\\d{3})+(\\.\\d+)?$/.test(raw)) {
    normalized = raw.replace(/,/g, '');
  } else if (raw.includes(',')) {
    normalized = raw.replace(/\\./g, '').replace(',', '.');
  }
  const parsed = Number(normalized);
  return Number.isFinite(parsed) ? parsed : 0;
};"""
          if old not in s: raise SystemExit('No se encontró parser esperado')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validar ejemplos CLP
        run: |
          node --check routes/importaciones.js
          node <<'NODE'
          const numberOrZero = (value) => {
            if (typeof value === 'number') return Number.isFinite(value) ? value : 0;
            const raw = String(value ?? '').replace(/[$\s]/g, '').trim();
            if (!raw) return 0;
            let normalized = raw;
            if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(raw)) normalized = raw.replace(/\./g, '').replace(',', '.');
            else if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(raw)) normalized = raw.replace(/,/g, '');
            else if (raw.includes(',')) normalized = raw.replace(/\./g, '').replace(',', '.');
            const parsed = Number(normalized);
            return Number.isFinite(parsed) ? parsed : 0;
          };
          const cases = [['25.000',25000],['$ 1.250.000',1250000],['25000',25000],['25.000,50',25000.5],['25,000',25000],[25000,25000]];
          for (const [input,expected] of cases) {
            const actual=numberOrZero(input);
            if (actual!==expected) throw new Error(`${input}: ${actual} != ${expected}`);
          }
          console.log('CLP parser OK');
          NODE
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/importaciones.js
          git commit -m "Corregir lectura de montos CLP en importaciones"
          git push origin HEAD:agent/fix-import-clp-parser
