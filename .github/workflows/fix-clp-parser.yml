name: Fix CLP parser
on:
  push:
    branches:
      - agent/fix-import-clp-parser
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-import-clp-parser
      - name: Aplicar parche
        run: node scripts/fixClpParser.cjs
      - name: Validar sintaxis
        run: node --check routes/importaciones.js
      - name: Validar montos chilenos
        run: node -e "const f=v=>{if(typeof v==='number')return Number.isFinite(v)?v:0;const r=String(v??'').replace(/[$\\s]/g,'').trim();if(!r)return 0;let n=r;if(/^-?\\d{1,3}(\\.\\d{3})+(,\\d+)?$/.test(r))n=r.replace(/\\./g,'').replace(',','.');else if(/^-?\\d{1,3}(,\\d{3})+(\\.\\d+)?$/.test(r))n=r.replace(/,/g,'');else if(r.includes(','))n=r.replace(/\\./g,'').replace(',','.');const p=Number(n);return Number.isFinite(p)?p:0};for(const [a,b] of [['25.000',25000],['$ 1.250.000',1250000],['25000',25000],['25.000,50',25000.5],['25,000',25000],[25000,25000]]){if(f(a)!==b)throw new Error(a+' => '+f(a)+' esperado '+b)};console.log('CLP parser OK')"
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/importaciones.js
          git commit -m "Corregir lectura de montos CLP en importaciones"
          git push origin HEAD:agent/fix-import-clp-parser
